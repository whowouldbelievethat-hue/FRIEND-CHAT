<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54"><title>Friends Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#075e54;--green2:#128c7e;--lime:#25d366;--bg:#071419;--panel:#101f25;--panel2:#172a31;--line:#263b42;--text:#edf5f4;--muted:#8da4a8;--bubble:#075e54;--other:#1b3037;--danger:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Arial,sans-serif;height:100dvh;overflow:hidden}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}
.screen{height:100dvh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 15% 15%,#128c7e44,transparent 35%),radial-gradient(circle at 90% 90%,#25d3661a,transparent 30%),var(--bg)}
.auth{width:min(440px,100%);background:#101f25ed;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 24px 90px #0009}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--lime),var(--green2));display:grid;place-items:center;font-size:25px;color:#042c26}.brand h1{font-size:23px;margin:0}.brand p{margin:2px 0;color:var(--muted);font-size:12px}.tabs{display:flex;background:var(--panel2);border-radius:12px;padding:4px;margin-bottom:18px}.tabs button{flex:1;padding:9px;border-radius:9px;background:transparent;color:var(--muted)}.tabs button.active{background:var(--green2);color:white}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px;outline:0}.field input:focus,.field textarea:focus{border-color:var(--lime)}.primary{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;padding:12px 16px;border-radius:11px;font-weight:800;width:100%}.error{color:#ff9999;font-size:12px;min-height:18px;margin-top:8px}
#app{height:100dvh;display:grid;grid-template-columns:minmax(290px,390px) 1fr;max-width:1600px;margin:auto;background:var(--panel);border-inline:1px solid var(--line)}
.sidebar{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.top{height:72px;padding:10px 14px;display:flex;align-items:center;gap:10px;background:var(--panel2)}.top .brand{margin:0;flex:1}.top .brand h1{font-size:19px}.top .logo{width:40px;height:40px;border-radius:13px;font-size:21px}.icon{width:39px;height:39px;border-radius:50%;background:transparent;color:var(--muted);font-size:19px}.icon:hover{background:#ffffff12;color:var(--text)}.search{padding:10px 12px}.search input{width:100%;border:0;outline:0;background:var(--panel2);padding:11px 14px;border-radius:11px}.tabs2{display:flex;padding:0 12px 9px;gap:7px}.tabs2 button{background:var(--panel2);color:var(--muted);border-radius:20px;padding:6px 12px;font-size:12px}.tabs2 button.active{background:#075e54;color:#fff}.stories{display:flex;gap:12px;overflow:auto;padding:10px 12px;border-bottom:1px solid var(--line)}.story{width:62px;flex:none;text-align:center;font-size:10px;color:var(--muted);cursor:pointer}.story .ring{width:54px;height:54px;margin:auto auto 4px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#25d366,#9a63ff)}.story img,.story .fallback{width:100%;height:100%;border-radius:50%;object-fit:cover;background:var(--panel2);display:grid;place-items:center;border:2px solid var(--panel);font-size:20px}.chatlist{overflow:auto;flex:1}.chatitem{display:flex;gap:12px;padding:12px 14px;align-items:center;border-bottom:1px solid #ffffff0a;cursor:pointer}.chatitem:hover,.chatitem.active{background:var(--panel2)}.avatar{width:49px;height:49px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#2a9d8f,#075e54);display:grid;place-items:center;font-weight:800;color:white;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.chatmeta{min-width:0;flex:1}.chatmeta strong{display:flex;justify-content:space-between;gap:8px;font-size:13px}.chatmeta small{color:var(--muted);font-size:10px;white-space:nowrap}.preview{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.mefoot{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line);background:var(--panel2)}.mefoot .avatar{width:38px;height:38px}.mefoot .who{flex:1;min-width:0}.mefoot small{display:block;color:var(--muted);font-size:10px}
.main{display:flex;flex-direction:column;min-width:0;position:relative;background:radial-gradient(circle at 50% 50%,#10252a,#0b191e)}.welcome{margin:auto;text-align:center;color:var(--muted);padding:25px}.welcome .big{font-size:64px}.chathead{height:72px;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel2);border-bottom:1px solid var(--line)}.chathead .info{flex:1;min-width:0}.chathead strong{display:block}.chathead small{color:var(--muted);font-size:11px}.messages{flex:1;overflow:auto;padding:20px clamp(12px,5vw,70px);display:flex;flex-direction:column;gap:8px}.day{align-self:center;background:#15282e;color:var(--muted);padding:5px 13px;border-radius:20px;font-size:10px;margin:8px}.msg{max-width:min(76%,560px);padding:9px 12px;border-radius:13px;background:var(--other);align-self:flex-start;box-shadow:0 2px 4px #0002;position:relative;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:var(--bubble);border-top-left-radius:4px}.msg .sender{font-size:10px;color:#a9e7d8;font-weight:800}.msg p{margin:2px 0 4px;white-space:pre-wrap;font-size:13px;line-height:1.7}.msg time{display:block;text-align:left;color:#c0d2cf;font-size:9px}.msg img{max-width:min(330px,100%);max-height:280px;border-radius:9px;display:block}.msg audio{max-width:260px;height:38px}.msg a{color:#a9f3d4}.replyquote{border-right:3px solid var(--lime);padding:4px 8px;background:#0002;border-radius:5px;font-size:10px;color:#c7e6dc;margin-bottom:6px}.reactions{display:flex;gap:4px;margin-top:4px}.react{font-size:11px;background:#ffffff18;border-radius:12px;padding:2px 6px}.composer{display:flex;align-items:flex-end;gap:8px;padding:12px 16px;background:var(--panel2);border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;max-height:110px;min-height:42px;border:0;outline:0;border-radius:13px;background:#0d1b20;padding:11px 14px;font-size:13px}.send{width:43px;height:43px;border-radius:50%;background:var(--green2);font-size:18px}.hint{padding:4px 16px;background:var(--panel2);font-size:10px;color:var(--muted)}.unread{background:var(--lime);color:#06372c;border-radius:20px;padding:1px 7px;font-size:10px}.modalback{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20;padding:15px}.modal{width:min(460px,100%);max-height:85dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.modal h3{margin:0 0 12px}.modal .field{margin:10px 0}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.secondary{background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:10px}.danger{color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:25px;font-size:12px}.statusview{display:grid;place-items:center;min-height:240px;text-align:center}.statusview img{max-width:100%;max-height:55vh;border-radius:14px}.statusview p{white-space:pre-wrap}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20383e;padding:10px 16px;border-radius:12px;z-index:50;font-size:12px;box-shadow:0 6px 25px #0007}
@media(max-width:760px){#app{grid-template-columns:1fr}.sidebar{display:flex}.main{display:none}.main.mobile-show{display:flex;position:absolute;inset:0;z-index:5}.sidebar.mobile-hide{display:none}.chathead .back{display:block!important}.msg{max-width:88%}.messages{padding:14px 10px}.composer{padding:9px}.stories{padding:8px 10px}}
@media(min-width:761px){.chathead .back{display:none!important}}
</style>
</head>
<body>
<section id="authScreen" class="screen"><div class="auth"><div class="brand"><div class="logo">✦</div><div><h1>Friends Chat</h1><p>مساحتك الخاصة للكلام مع أصحابك</p></div></div><div class="tabs"><button id="loginTab" class="active">تسجيل الدخول</button><button id="signupTab">إنشاء حساب</button></div>
<form id="authForm"><div id="nameField" class="field hidden"><label>اسم العرض</label><input id="displayName" maxlength="30" placeholder="اسمك بين أصحابك"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required autocomplete="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="6 أحرف على الأقل"></div><button class="primary" id="authSubmit">دخول</button><div class="error" id="authError"></div></form></div></section>
<div id="app" class="hidden"><aside class="sidebar" id="sidebar"><div class="top"><div class="brand"><div class="logo">✦</div><div><h1>Friends Chat</h1><p>متصل بأصحابك</p></div></div><button class="icon" id="newChatBtn" title="محادثة جديدة">＋</button><button class="icon" id="groupBtn" title="مجموعة">♧</button></div>
<div class="stories" id="stories"><div class="story" id="addStory"><div class="ring"><div class="fallback">＋</div></div>حالتي</div></div>
<div class="search"><input id="search" placeholder="ابحث في المحادثات..."></div><div class="tabs2"><button class="active" data-filter="all">الكل</button><button data-filter="unread">غير مقروءة</button><button data-filter="groups">المجموعات</button></div><div class="chatlist" id="chatList"><div class="empty">لا توجد محادثات بعد</div></div>
<div class="mefoot"><div class="avatar" id="myAvatar">؟</div><div class="who"><strong id="myName">حسابي</strong><small id="myHandle"></small></div><button class="icon" id="profileBtn" title="الملف الشخصي">⚙</button><button class="icon" id="logoutBtn" title="خروج">↪</button></div></aside>
<main class="main" id="main"><div class="welcome"><div class="big">✦</div><h2>أهلاً بيك في Friends Chat</h2><p>اختار محادثة أو ابدأ واحدة جديدة.</p></div></main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
/* ضع إعدادات مشروع Firebase الخاص بك هنا من Firebase Console */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId: "YOUR_APP_ID"
};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let auth,db,storage,user=null,profile=null,signup=false,activeChat=null,chatDocs=[],unsubs=[],msgUnsub=null,filter='all',replyTo=null,mediaRecorder=null,audioChunks=[],recording=false;
const configured=!firebaseConfig.apiKey.startsWith('YOUR_');
function toast(t){$('#toastRoot').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function avatarHTML(p,size=''){return p?.photoURL?`<img src="${esc(p.photoURL)}" alt="صورة ${esc(p.displayName||'المستخدم')}">`:`<span>${esc((p?.displayName||'?').slice(0,1))}</span>`}
function modal(title,body){$('#modalRoot').innerHTML=`<div class="modalback" id="modalBack"><div class="modal"><div class="row"><h3>${title}</h3><button class="icon" id="closeModal">×</button></div>${body}</div></div>`;$('#closeModal').onclick=closeModal;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()}}
function closeModal(){$('#modalRoot').innerHTML=''}
function cleanListeners(){unsubs.forEach(f=>f&&f());unsubs=[];if(msgUnsub){msgUnsub();msgUnsub=null}}
function requireDb(){if(!configured)throw Error('أضف إعدادات Firebase أولاً في ملف index.html')}
$('#loginTab').onclick=()=>setSignup(false);$('#signupTab').onclick=()=>setSignup(true);
function setSignup(v){signup=v;$('#loginTab').classList.toggle('active',!v);$('#signupTab').classList.toggle('active',v);$('#nameField').classList.toggle('hidden',!v);$('#authSubmit').textContent=v?'إنشاء الحساب':'دخول';$('#authError').textContent=''}
$('#authForm').addEventListener('submit',async e=>{e.preventDefault();$('#authError').textContent='';try{requireDb();let email=$('#email').value.trim(),pass=$('#password').value;if(signup){let name=$('#displayName').value.trim();if(!name)throw Error('اكتب اسم العرض');let c=await auth.createUserWithEmailAndPassword(email,pass);await c.user.updateProfile({displayName:name});await db.collection('users').doc(c.user.uid).set({uid:c.user.uid,email,name:name.toLowerCase(),displayName:name,photoURL:'',about:'متاح للدردشة',createdAt:firebase.firestore.FieldValue.serverTimestamp(),lastSeen:firebase.firestore.FieldValue.serverTimestamp()});}else await auth.signInWithEmailAndPassword(email,pass)}catch(err){$('#authError').textContent=err.message}});
async function boot(){try{if(!configured){$('#authError').textContent='إعداد Firebase غير مكتمل. راجع README.md';return}firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();storage=firebase.storage();auth.onAuthStateChanged(async u=>{cleanListeners();user=u;if(!u){$('#app').classList.add('hidden');$('#authScreen').classList.remove('hidden');return}let ref=db.collection('users').doc(u.uid);let snap=await ref.get();if(!snap.exists){let name=u.displayName||u.email.split('@')[0];await ref.set({uid:u.uid,email:u.email,name:name.toLowerCase(),displayName:name,photoURL:'',about:'متاح للدردشة',createdAt:firebase.firestore.FieldValue.serverTimestamp()});snap=await ref.get()}profile=snap.data();$('#authScreen').classList.add('hidden');$('#app').classList.remove('hidden');renderMe();await ref.set({lastSeen:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});subscribeChats();subscribeStories();});}catch(e){$('#authError').textContent=e.message}}
function renderMe(){$('#myName').textContent=profile.displayName||'حسابي';$('#myHandle').textContent='@'+(profile.name||'');$('#myAvatar').innerHTML=avatarHTML(profile)}
$('#logoutBtn').onclick=()=>auth.signOut();$('#profileBtn').onclick=profileModal;
function profileModal(){modal('الملف الشخصي',`<div class="row"><div class="avatar" style="width:66px;height:66px">${avatarHTML(profile)}</div><div><b>${esc(profile.displayName)}</b><small style="display:block;color:var(--muted)">@${esc(profile.name)}</small></div></div><div class="field"><label>اسم العرض</label><input id="editDisplay" value="${esc(profile.displayName||'')}"></div><div class="field"><label>اسم المستخدم (بدون @)</label><input id="editHandle" value="${esc(profile.name||'')}"></div><div class="field"><label>نبذة</label><input id="editAbout" maxlength="100" value="${esc(profile.about||'')}"></div><div class="field"><label>صورة الحساب</label><input id="editPhoto" type="file" accept="image/*"></div><button class="primary" id="saveProfile">حفظ التعديلات</button>`);$('#saveProfile').onclick=async()=>{try{let name=$('#editHandle').value.trim().toLowerCase(),displayName=$('#editDisplay').value.trim();if(!/^[a-z0-9_.]{3,20}$/.test(name))throw Error('اسم المستخدم: 3 إلى 20 حرفًا إنجليزيًا أو رقمًا');if(!displayName)throw Error('اكتب اسم العرض');let photoURL=profile.photoURL||'';let f=$('#editPhoto').files[0];if(f){if(!f.type.startsWith('image/'))throw Error('اختر صورة');if(f.size>5*1024*1024)throw Error('الصورة أكبر من 5MB');let r=storage.ref(`avatars/${user.uid}/${Date.now()}_${f.name}`);await r.put(f);photoURL=await r.getDownloadURL()}await db.collection('users').doc(user.uid).update({name,displayName,about:$('#editAbout').value.trim(),photoURL});profile={...profile,name,displayName,about:$('#editAbout').value.trim(),photoURL};renderMe();closeModal();toast('تم تحديث الملف الشخصي')}catch(e){toast(e.message)}}}
async function subscribeChats(){unsubs.push(db.collection('chats').where('members','array-contains',user.uid).onSnapshot(async snap=>{chatDocs=snap.docs.map(d=>({id:d.id,...d.data()}));renderChatList()}))}
function renderChatList(){let q=$('#search').value.toLowerCase();let arr=chatDocs.filter(c=>(filter==='all'||(filter==='groups'&&c.type==='group')||(filter==='unread'&&(c.unread?.[user.uid]||0)>0))&&(c.title||c.memberNames?.[user.uid]||'').toLowerCase().includes(q));$('#chatList').innerHTML=arr.length?arr.map(c=>{let title=c.type==='group'?(c.title||'مجموعة'):(c.memberNames?.[user.uid]||'محادثة');let other=c.members?.find(x=>x!==user.uid);let photo=c.type==='group'?'':c.memberPhotos?.[other];return `<div class="chatitem ${activeChat?.id===c.id?'active':''}" data-chat="${c.id}"><div class="avatar">${photo?`<img src="${esc(photo)}">`:(c.type==='group'?'♧':esc(title[0]||'?'))}</div><div class="chatmeta"><strong>${esc(title)} <small>${c.lastAt?.toDate?c.lastAt.toDate().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):''}</small></strong><div class="preview">${esc(c.lastMessage||'ابدأ المحادثة')}</div></div>${(c.unread?.[user.uid]||0)>0?`<span class="unread">${c.unread[user.uid]}</span>`:''}</div>`}).join(''):'<div class="empty">مفيش محادثات مطابقة. ابدأ محادثة جديدة من علامة ＋</div>';$('#chatList').querySelectorAll('[data-chat]').forEach(el=>el.onclick=()=>openChat(el.dataset.chat))}
$('#search').oninput=renderChatList;document.querySelectorAll('.tabs2 button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.tabs2 button').forEach(x=>x.classList.toggle('active',x===b));renderChatList()});
async function openChat(id){let c=chatDocs.find(x=>x.id===id);if(!c)return;activeChat=c;renderChatList();$('#sidebar').classList.add('mobile-hide');$('#main').classList.add('mobile-show');let title=c.type==='group'?(c.title||'مجموعة'):(c.memberNames?.[user.uid]||'محادثة');$('#main').innerHTML=`<div class="chathead"><button class="icon back" id="backBtn">‹</button><div class="avatar">${c.type==='group'?'♧':'✦'}</div><div class="info"><strong>${esc(title)}</strong><small>${c.type==='group'?(c.members?.length||0)+' أعضاء':'محادثة خاصة'}</small></div><button class="icon" id="chatInfo" title="معلومات">ⓘ</button></div><div class="messages" id="messages"><div class="empty">تحميل الرسائل...</div></div><div class="hint" id="replyHint"></div><div class="composer"><button class="icon" id="attachBtn" title="إرفاق ملف">＋</button><input type="file" id="filePick" class="hidden" accept="image/*,application/pdf,.doc,.docx,.txt,.zip"><button class="icon" id="recordBtn" title="تسجيل صوتي">🎙</button><textarea id="messageText" rows="1" placeholder="اكتب رسالة..."></textarea><button class="send" id="sendBtn">➤</button></div>`;$('#backBtn').onclick=()=>{$('#sidebar').classList.remove('mobile-hide');$('#main').classList.remove('mobile-show')};$('#sendBtn').onclick=sendMessage;$('#messageText').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};$('#attachBtn').onclick=()=>$('#filePick').click();$('#filePick').onchange=uploadAttachment;$('#recordBtn').onclick=toggleRecording;$('#chatInfo').onclick=()=>chatInfo(c);if(msgUnsub)msgUnsub();msgUnsub=db.collection('chats').doc(id).collection('messages').orderBy('createdAt').limit(150).onSnapshot(s=>{renderMessages(s.docs);db.collection('chats').doc(id).set({[`unread.${user.uid}`]:0},{merge:true})});}
function renderMessages(docs){let box=$('#messages');if(!box)return;box.innerHTML=docs.length?docs.map(d=>{let m=d.data(),mine=m.sender===user.uid;let time=m.createdAt?.toDate?m.createdAt.toDate().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';let content=m.kind==='image'?`<a href="${esc(m.url)}" target="_blank"><img src="${esc(m.url)}" alt="صورة مرفقة"></a>`:m.kind==='audio'?`<audio controls src="${esc(m.url)}"></audio>`:m.kind==='file'?`📎 <a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.fileName||'تحميل الملف')}</a>`:`<p>${esc(m.text||'')}</p>`;return `<div class="msg ${mine?'mine':''}" data-id="${d.id}">${!mine&&activeChat?.type==='group'?`<div class="sender">${esc(m.senderName||'')}</div>`:''}${m.replyText?`<div class="replyquote">${esc(m.replyText)}</div>`:''}${content}${m.edited?'<small>تم التعديل</small>':''}<time>${time}</time><div class="reactions">${(m.reactions||[]).map(x=>`<span class="react">${esc(x.emoji)}</span>`).join('')}</div><div class="row" style="margin-top:3px;gap:3px"><button class="icon" style="width:25px;height:22px;font-size:12px" data-reply="${d.id}">↩</button><button class="icon" style="width:25px;height:22px;font-size:12px" data-react="${d.id}">☺</button>${mine&&m.kind==='text'?`<button class="icon" style="width:25px;height:22px;font-size:12px" data-edit="${d.id}">✎</button>`:''}${mine?`<button class="icon danger" style="width:25px;height:22px;font-size:12px" data-delete="${d.id}">×</button>`:''}</div></div>`}).join(''):'<div class="empty">ابدأ أول رسالة في المحادثة 👋</div>';box.scrollTop=box.scrollHeight;box.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{let d=docs.find(x=>x.id===b.dataset.reply),m=d.data();replyTo={id:d.id,text:m.text||m.fileName||'مرفق'};$('#replyHint').textContent='رد على: '+replyTo.text;});box.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>reactMessage(b.dataset.react));box.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMessage(b.dataset.delete));box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editMessage(b.dataset.edit,docs))}
async function sendMessage(){let text=$('#messageText').value.trim();if(!text)return;try{let ref=db.collection('chats').doc(activeChat.id),unread={};activeChat.members.forEach(uid=>{if(uid!==user.uid)unread[uid]=firebase.firestore.FieldValue.increment(1)});await ref.collection('messages').add({text,kind:'text',sender:user.uid,senderName:profile.displayName,createdAt:firebase.firestore.FieldValue.serverTimestamp(),replyText:replyTo?.text||'',replyId:replyTo?.id||''});await ref.set({lastMessage:text.slice(0,90),lastAt:firebase.firestore.FieldValue.serverTimestamp(),unread},{merge:true});$('#messageText').value='';replyTo=null;$('#replyHint').textContent=''}catch(e){toast(e.message)}}
async function uploadAttachment(e){let f=e.target.files[0];if(!f||!activeChat)return;try{if(f.size>15*1024*1024)throw Error('الحد الأقصى للمرفق 15MB');let kind=f.type.startsWith('image/')?'image':'file';let path=`chatFiles/${activeChat.id}/${user.uid}/${Date.now()}_${f.name}`;let r=storage.ref(path);await r.put(f);let url=await r.getDownloadURL();await db.collection('chats').doc(activeChat.id).collection('messages').add({kind,url,fileName:f.name,sender:user.uid,senderName:profile.displayName,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('chats').doc(activeChat.id).set({lastMessage:kind==='image'?'📷 صورة':'📎 '+f.name,lastAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});toast('تم إرسال المرفق')}catch(err){toast(err.message)}e.target.value=''}
async function toggleRecording(){if(recording){mediaRecorder.stop();recording=false;$('#recordBtn').textContent='🎙';return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=async()=>{try{let blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});let ref=storage.ref(`chatFiles/${activeChat.id}/${user.uid}/${Date.now()}.webm`);await ref.put(blob);let url=await ref.getDownloadURL();await db.collection('chats').doc(activeChat.id).collection('messages').add({kind:'audio',url,sender:user.uid,senderName:profile.displayName,createdAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('chats').doc(activeChat.id).set({lastMessage:'🎙 رسالة صوتية',lastAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}catch(e){toast(e.message)}stream.getTracks().forEach(t=>t.stop())};mediaRecorder.start();recording=true;$('#recordBtn').textContent='⏹';toast('جاري التسجيل، اضغط لإيقاف التسجيل وإرسال الصوت')}catch(e){toast('لم يتم السماح باستخدام الميكروفون أو المتصفح لا يدعم التسجيل')}}
async function reactMessage(id){let emoji=prompt('اكتب تفاعلًا: ❤️ 😂 👍 🔥');if(!emoji)return;await db.collection('chats').doc(activeChat.id).collection('messages').doc(id).update({reactions:firebase.firestore.FieldValue.arrayUnion({uid:user.uid,emoji:emoji.slice(0,4)})})}
async function deleteMessage(id){if(!confirm('حذف الرسالة؟'))return;await db.collection('chats').doc(activeChat.id).collection('messages').doc(id).update({text:'تم حذف الرسالة',kind:'text',deleted:true});toast('تم حذف الرسالة')}
async function editMessage(id,docs){let d=docs.find(x=>x.id===id);let t=prompt('تعديل الرسالة',d.data().text||'');if(t===null||!t.trim())return;await db.collection('chats').doc(activeChat.id).collection('messages').doc(id).update({text:t.trim(),edited:true})}
function chatInfo(c){modal('معلومات المحادثة',`<p>النوع: ${c.type==='group'?'مجموعة':'محادثة خاصة'}</p><p>الأعضاء: ${c.members.length}</p>${c.type==='group'?`<p>اسم المجموعة: ${esc(c.title||'')}</p>`:''}<button class="secondary" id="closeInfo">إغلاق</button>`);$('#closeInfo').onclick=closeModal}
$('#newChatBtn').onclick=()=>modal('ابدأ محادثة',`<p style="color:var(--muted);font-size:12px">ابحث باسم المستخدم الذي سجّل به صديقك.</p><div class="field"><label>اسم المستخدم</label><input id="friendHandle" placeholder="username"></div><button class="primary" id="findFriend">بحث وبدء المحادثة</button><div id="findResult" class="error"></div>`); 
document.addEventListener('click',async e=>{if(e.target.id==='findFriend'){let h=$('#friendHandle').value.trim().toLowerCase();try{let s=await db.collection('users').where('name','==',h).limit(1).get();if(s.empty){$('#findResult').textContent='لم يتم العثور على المستخدم';return}let p=s.docs[0].data();if(p.uid===user.uid){$('#findResult').textContent='هذا حسابك أنت';return}let existing=chatDocs.find(c=>c.type==='private'&&c.members.includes(p.uid));let id;if(existing)id=existing.id;else{let ref=await db.collection('chats').add({type:'private',members:[user.uid,p.uid],memberNames:{[user.uid]:profile.displayName,[p.uid]:p.displayName},memberPhotos:{[user.uid]:profile.photoURL||'',[p.uid]:p.photoURL||''},unread:{},createdAt:firebase.firestore.FieldValue.serverTimestamp(),lastMessage:'بدأت المحادثة'});id=ref.id}closeModal();setTimeout(()=>openChat(id),500)}catch(err){$('#findResult').textContent=err.message}}});
$('#groupBtn').onclick=()=>modal('إنشاء مجموعة',`<div class="field"><label>اسم المجموعة</label><input id="groupName" maxlength="40" placeholder="اسم المجموعة"></div><div class="field"><label>أسماء المستخدمين مفصولة بفاصلة</label><input id="groupMembers" placeholder="ahmed, sara"></div><button class="primary" id="createGroup">إنشاء المجموعة</button><div id="groupError" class="error"></div>`);
document.addEventListener('click',async e=>{if(e.target.id==='createGroup'){try{let title=$('#groupName').value.trim(),handles=$('#groupMembers').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);if(!title)throw Error('اكتب اسم المجموعة');let members=[user.uid],memberNames={[user.uid]:profile.displayName},memberPhotos={[user.uid]:profile.photoURL||''};for(let h of handles){let s=await db.collection('users').where('name','==',h).limit(1).get();if(!s.empty){let p=s.docs[0].data();if(!members.includes(p.uid)){members.push(p.uid);memberNames[p.uid]=p.displayName;memberPhotos[p.uid]=p.photoURL||''}}}if(members.length<2)throw Error('أضف مستخدمًا واحدًا على الأقل');let r=await db.collection('chats').add({type:'group',title,members,memberNames,memberPhotos,unread:{},createdAt:firebase.firestore.FieldValue.serverTimestamp(),lastMessage:'تم إنشاء المجموعة'});closeModal();toast('تم إنشاء المجموعة');setTimeout(()=>openChat(r.id),500)}catch(err){$('#groupError').textContent=err.message}}});
async function subscribeStories(){unsubs.push(db.collection('statuses').where('expiresAt','>',firebase.firestore.Timestamp.now()).onSnapshot(s=>renderStories(s.docs)))}
function renderStories(docs){let by={};docs.forEach(d=>{let x=d.data();if(!by[x.uid]||by[x.uid].createdAt?.toMillis()<x.createdAt?.toMillis())by[x.uid]=x});let html='<div class="story" id="addStory"><div class="ring"><div class="fallback">＋</div></div>حالتي</div>';Object.values(by).forEach(x=>{html+=`<div class="story" data-story="${x.uid}"><div class="ring"><div class="fallback">${x.photoURL?`<img src="${esc(x.photoURL)}">`:esc((x.displayName||'?')[0])}</div></div>${esc(x.uid===user.uid?'حالتي':x.displayName)}</div>`});$('#stories').innerHTML=html;$('#addStory').onclick=addStatus;$('#stories').querySelectorAll('[data-story]').forEach(el=>el.onclick=()=>viewStatus(el.dataset.story,by[el.dataset.story]))}
async function addStatus(){modal('إضافة حالة',`<div class="field"><label>اكتب حالة أو اختر صورة</label><textarea id="statusText" rows="3" placeholder="بتعمل إيه؟"></textarea></div><div class="field"><input id="statusFile" type="file" accept="image/*"></div><button class="primary" id="publishStatus">نشر الحالة لمدة 24 ساعة</button>`);$('#publishStatus').onclick=async()=>{try{let text=$('#statusText').value.trim(),f=$('#statusFile').files[0],url='';if(!text&&!f)throw Error('اكتب نصًا أو اختر صورة');if(f){let r=storage.ref(`statuses/${user.uid}/${Date.now()}_${f.name}`);await r.put(f);url=await r.getDownloadURL()}let now=Date.now();await db.collection('statuses').add({uid:user.uid,displayName:profile.displayName,photoURL:profile.photoURL||'',text,url,createdAt:firebase.firestore.Timestamp.fromMillis(now),expiresAt:firebase.firestore.Timestamp.fromMillis(now+86400000)});closeModal();toast('تم نشر الحالة')}catch(e){toast(e.message)}}}
function viewStatus(uid,x){modal('حالة '+esc(x.displayName||''),`<div class="statusview">${x.url?`<img src="${esc(x.url)}" alt="الحالة">`:''}<p>${esc(x.text||'')}</p><small style="color:var(--muted)">تنتهي بعد 24 ساعة من النشر</small></div>`)}
boot();
</script></body></html>
